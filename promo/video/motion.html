<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meo motion intro</title>
<!--
  Full motion-design intro, 48s at 120 BPM (one bar = 2s).
  Same contract as index.html: render(t) draws any frame, render.js steps through
  time and pipes frames to ffmpeg. window.CUES lists every sound cue so music.py
  can land each whoosh, blip and stamp on the frame it belongs to.

  Query params:
    format  16x9 | 9x16                  (default 16x9)
    cta     upwork | web                 (default: upwork for 16x9, web for 9x16)
    play    preview in real time
    t       freeze at a time in seconds
    grain   0 turns off the in-page grain (render.js adds it in ffmpeg instead)

  The idea: the teal cursor from the logo carries the whole piece. It types "meo",
  backspaces the screen, and every scene morphs into the next: an open padlock
  becomes a radar (find it), the findings collapse into a shield (fix it), the
  shield flips into a stamped policy (prove it), the three line up, turn into an
  AI agent network, then into the ring around the portrait, and finally back into
  the cursor for the call to action.
-->
<style>
@font-face{font-family:"Bricolage Grotesque"; src:url(fonts/bricolage-grotesque.woff2) format("woff2"); font-weight:200 800}
@font-face{font-family:"IBM Plex Sans"; src:url(fonts/ibm-plex-sans.woff2) format("woff2"); font-weight:100 700}
@font-face{font-family:"JetBrains Mono"; src:url(fonts/jetbrains-mono.woff2) format("woff2"); font-weight:100 800}
:root{
--ink:#0A0E1A; --panel:#0F1729; --line-2:rgba(232,236,243,.18);
--bone:#E8ECF3; --fog:#8A96AD; --soft:#C3CBDA; --teal:#2DD4BF; --ember:#F5A524; --peri:#8B9CFF;
--display:"Bricolage Grotesque", system-ui, sans-serif;
--body:"IBM Plex Sans", system-ui, sans-serif;
--mono:"JetBrains Mono", ui-monospace, monospace;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{background:#000; overflow:hidden}
#stage{position:relative; overflow:hidden; background:var(--ink); color:var(--bone); font-family:var(--body); -webkit-font-smoothing:antialiased}
.layer{position:absolute; inset:0}
.abs{position:absolute}
svg{display:block; overflow:visible}
.disp{font-family:var(--display); font-weight:800; letter-spacing:-.018em; line-height:1.02}
.mono{font-family:var(--mono)}
.w{display:inline-block; transform-origin:50% 75%; will-change:transform}
.mask{position:relative; overflow:hidden}
.roll{position:absolute; left:0; right:0; top:0; white-space:nowrap}
.ember{color:var(--ember)} .teal{color:var(--teal)} .peri{color:var(--peri)} .fog{color:var(--fog)} .soft{color:var(--soft)}
#grain{position:absolute; inset:0; opacity:.06; mix-blend-mode:overlay}
.vignette{position:absolute; inset:0; background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.5))}
.pill{display:inline-flex; align-items:center; gap:.35em; background:var(--teal); color:#04201C; font-family:var(--display); font-weight:800; border-radius:999px; padding:.32em .9em; box-shadow:0 0 0 .25em rgba(45,212,191,.14), 0 .4em 1.2em rgba(45,212,191,.28)}
.pill svg{width:.8em; height:.8em}
.bars{display:flex; gap:calc(var(--u)*1)}
.bars i{display:block; width:calc(var(--u)*6); height:calc(var(--u)*.5); border-radius:9px; background:rgba(232,236,243,.14); overflow:hidden}
.bars b{display:block; height:100%; width:0}
.stats{display:grid; grid-template-columns:repeat(3, 1fr); gap:calc(var(--u)*3)}
.stat .n{font-family:var(--display); font-weight:800; line-height:1; letter-spacing:-.02em}
.stat .l{color:var(--soft); line-height:1.35; margin-top:calc(var(--u)*.8)}
.avatar{position:absolute; border-radius:50%; overflow:hidden}
.avatar img{width:100%; height:100%; object-fit:cover; display:block}
</style>
</head>
<body>
<div id="stage">
  <canvas id="grid" class="layer"></canvas>
  <div id="glow" class="layer"></div>
  <div id="cam" class="layer"><div id="scenes" class="layer"></div></div>
  <div id="flash" class="layer" style="background:#2DD4BF; opacity:0"></div>
  <svg id="fx" class="layer"></svg>
  <div id="wm" class="abs"></div>
  <div class="vignette"></div>
  <canvas id="grain"></canvas>
</div>

<script>
// ---------- Setup ----------
var Q = new URLSearchParams(location.search);
var FORMAT = Q.get('format') === '9x16' ? '9x16' : '16x9';
var WIDE = FORMAT === '16x9';
var W = WIDE ? 1920 : 1080, H = WIDE ? 1080 : 1920;
var U = Math.min(W, H) / 100;
var CTA = Q.get('cta') || (WIDE ? 'upwork' : 'web');
var stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
stage.style.setProperty('--u', U + 'px');
window.DURATION = 48;

var NS = 'http://www.w3.org/2000/svg';
function S(tag, attrs, parent){ var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }
function el(tag, cls, parent, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (parent) parent.appendChild(e); return e; }
function px(e, o){ for (var k in o) e.style[k] = o[k] + 'px'; }

var clamp = function(x){ return x < 0 ? 0 : x > 1 ? 1 : x; };
var seg = function(T, a, b){ return clamp((T - a) / (b - a)); };
var lerp = function(a, b, p){ return a + (b - a) * p; };
var E = {
  outC: function(p){ return 1 - Math.pow(1 - p, 3); },
  outQ: function(p){ return 1 - Math.pow(1 - p, 4); },
  outX: function(p){ return p >= 1 ? 1 : 1 - Math.pow(2, -10 * p); },
  inC: function(p){ return p * p * p; },
  inX: function(p){ return p <= 0 ? 0 : Math.pow(2, 10 * p - 10); },
  inOut: function(p){ return p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; },
  back: function(p){ var c1 = 1.7, c3 = c1 + 1; return p <= 0 ? 0 : 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); }
};
var C = { bone:[232,236,243], fog:[138,150,173], soft:[195,203,218], teal:[45,212,191], ember:[245,165,36], peri:[139,156,255], panel:[15,23,41] };
function rgba(c, a){ return 'rgba(' + Math.round(c[0]) + ',' + Math.round(c[1]) + ',' + Math.round(c[2]) + ',' + (a == null ? 1 : a) + ')'; }
function mix(a, b, p){ return [lerp(a[0], b[0], p), lerp(a[1], b[1], p), lerp(a[2], b[2], p)]; }
var blink = function(T){ return Math.floor(T / 0.25) % 2 === 0; };   // half-beat blink at 120 BPM

// Layout: one visual box and one text block per format
var L = WIDE ? {
  vis: { x: W * .705, y: H * .53, s: H * .68 },
  txt: { x: W * .075, y: H * .5, w: W * .42, align: 'left' },
  por: { x: W * .285, y: H * .5, r: H * .25 },
  info: { x: W * .48, y: H * .5, w: W * .45, align: 'left' },
  slotY: H * .64, slotDX: W * .2, slotR: H * .105, recapY: H * .27,
  wm: { x: W * .075, y: H * .075 }
} : {
  vis: { x: W * .5, y: H * .33, s: W * .74 },
  txt: { x: W * .08, y: H * .69, w: W * .84, align: 'center' },
  por: { x: W * .5, y: H * .3, r: W * .25 },
  info: { x: W * .06, y: H * .6, w: W * .88, align: 'center' },
  slotY: H * .52, slotDX: W * .3, slotR: W * .12, recapY: H * .28,
  wm: { x: W * .08, y: H * .065 }
};
var VB = L.vis;
function vp(x, y){ return [VB.x + x * VB.s / 1000, VB.y + y * VB.s / 1000]; }
var UNIT = VB.s / 1000;   // px per vis unit

// ---------- Cues, ripples, rings, flashes, shakes ----------
var CUES = []; window.CUES = CUES;
function cue(t, type, o){ var c = { t: +t.toFixed(3), type: type }; for (var k in (o || {})) c[k] = o[k]; CUES.push(c); }
var RIPPLES = [], SHAKES = [], FLASHES = [], RINGS = [];
function ripple(t, x, y){ RIPPLES.push({ t: t, x: x, y: y }); }
function shake(t, amp, dur){ SHAKES.push({ t: t, amp: amp, dur: dur }); }
function flash(t, a){ FLASHES.push({ t: t, a: a }); }
var fx = document.getElementById('fx'); fx.setAttribute('viewBox', '0 0 ' + W + ' ' + H); fx.setAttribute('width', W); fx.setAttribute('height', H);
function ringFx(t, x, y, r1, col, w, dur){ RINGS.push({ t: t, r1: r1, w: w, dur: dur, c: S('circle', { cx: x, cy: y, r: 0, fill: 'none', stroke: rgba(col) }, fx) }); }

// ---------- Background: dot grid with ripples, drifting motes, tinted glow ----------
var grid = document.getElementById('grid'); grid.width = W; grid.height = H;
var g2 = grid.getContext('2d');
var SP = 2.6 * U, DOTS = [];
for (var gy = SP / 2; gy < H; gy += SP) for (var gx = SP / 2; gx < W; gx += SP) DOTS.push([gx, gy]);
var seed = 3; function rnd(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
var MOTES = []; for (var m = 0; m < 46; m++) MOTES.push({ x: rnd() * W, y: rnd() * H, r: .12 * U + rnd() * .25 * U, v: .4 * U + rnd() * 1.4 * U, ph: rnd() * 6.28, a: .08 + rnd() * .18 });
function drawBG(T){
  g2.clearRect(0, 0, W, H);
  g2.fillStyle = 'rgba(232,236,243,.075)';
  var hot = [], d0 = .13 * U;
  for (var i = 0; i < DOTS.length; i++){
    var d = DOTS[i], inf = 0;
    for (var k = 0; k < RIPPLES.length; k++){
      var R = RIPPLES[k], dt = T - R.t;
      if (dt < 0 || dt > 2.4) continue;
      var dist = Math.hypot(d[0] - R.x, d[1] - R.y), front = dt * 140 * U;
      inf += Math.exp(-Math.pow((dist - front) / (5 * U), 2)) * Math.exp(-dt * 1.3);
    }
    if (inf > .03) hot.push([d[0], d[1], inf]); else g2.fillRect(d[0] - d0, d[1] - d0, 2 * d0, 2 * d0);
  }
  for (var h = 0; h < hot.length; h++){
    var q = Math.min(1, hot[h][2]), r = d0 + .3 * U * q;
    g2.fillStyle = rgba(C.teal, .1 + .7 * q);
    g2.beginPath(); g2.arc(hot[h][0], hot[h][1], r, 0, 6.2832); g2.fill();
  }
  for (var j = 0; j < MOTES.length; j++){
    var M = MOTES[j], y = ((M.y - T * M.v) % H + H) % H, x = M.x + Math.sin(T * .35 + M.ph) * 2 * U;
    g2.fillStyle = 'rgba(232,236,243,' + M.a + ')';
    g2.beginPath(); g2.arc(x, y, M.r, 0, 6.2832); g2.fill();
  }
}
var TINTS = [[0, C.teal], [3.6, C.ember], [13.9, C.teal], [19.9, C.peri], [25.9, C.teal], [29.6, C.peri], [35.7, C.teal]];
var glow = document.getElementById('glow');
function drawGlow(T){
  var col = TINTS[0][1];
  for (var i = 1; i < TINTS.length; i++) col = mix(col, TINTS[i][1], E.inOut(seg(T, TINTS[i][0], TINTS[i][0] + .8)));
  var gx = 80 + 7 * Math.sin(T * .2), gy = -4 + 5 * Math.cos(T * .15), qx = 6 + 6 * Math.cos(T * .12), qy = 92 + 5 * Math.sin(T * .17);
  glow.style.background =
    'radial-gradient(' + 70 * U + 'px ' + 46 * U + 'px at ' + gx + '% ' + gy + '%, ' + rgba(col, .17) + ', transparent 62%),' +
    'radial-gradient(' + 60 * U + 'px ' + 44 * U + 'px at ' + qx + '% ' + qy + '%, ' + rgba(mix(col, C.peri, .5), .09) + ', transparent 62%)';
}

// ---------- Shared pieces ----------
var LOGO_PATHS = [
  [7.4, 'M36 0V293V528H173V313H181Q188 397 208.5 447.0Q229 497 263.5 519.5Q298 542 346 542Q396 542 427.0 517.5Q458 493 473.0 442.5Q488 392 487 313H495Q502 396 524.0 446.0Q546 496 582.0 519.0Q618 542 667 542Q708 542 738.0 527.0Q768 512 788.5 482.0Q809 452 819.0 406.5Q829 361 829 300V0H667V286Q667 324 660.5 349.5Q654 375 641.0 387.5Q628 400 608 400Q582 400 560.0 376.5Q538 353 524.5 306.0Q511 259 511 187V0H353V290Q353 328 346.5 352.0Q340 376 326.5 388.0Q313 400 293 400Q268 400 246.5 379.5Q225 359 211.5 312.0Q198 265 198 187V0Z'],
  [847.4, 'M287 -14Q212 -14 161.5 7.5Q111 29 80.0 66.5Q49 104 35.5 152.0Q22 200 22 253Q22 310 36.5 362.0Q51 414 81.5 454.5Q112 495 160.5 518.5Q209 542 277 542Q345 542 393.5 518.5Q442 495 471.0 453.0Q500 411 508.5 356.0Q517 301 506 237L123 231V319L382 324L361 273Q367 319 359.5 350.5Q352 382 332.0 398.5Q312 415 277 415Q240 415 218.0 396.0Q196 377 187.0 342.5Q178 308 178 261Q178 180 205.0 143.0Q232 106 288 106Q312 106 328.0 112.0Q344 118 354.0 129.5Q364 141 368.0 157.5Q372 174 371 195L519 187Q522 154 512.5 119.0Q503 84 477.0 54.0Q451 24 404.5 5.0Q358 -14 287 -14Z'],
  [1364.4, 'M282 -14Q206 -14 147.0 16.5Q88 47 55.0 108.5Q22 170 22 263Q22 360 56.5 421.5Q91 483 150.5 512.5Q210 542 285 542Q363 542 421.5 511.5Q480 481 512.5 419.5Q545 358 545 264Q545 167 510.5 105.5Q476 44 416.5 15.0Q357 -14 282 -14ZM286 105Q317 105 338.0 122.5Q359 140 370.0 174.0Q381 208 381 255Q381 307 369.0 342.5Q357 378 334.5 397.0Q312 416 280 416Q250 416 229.0 398.5Q208 381 197.0 347.0Q186 313 186 265Q186 189 212.5 147.0Q239 105 286 105Z']
];
function makeLogo(parent, h){
  var w = h * 2202 / 643, svg = S('svg', { viewBox: '0 0 2202 643', width: w, height: h }, parent);
  var letters = LOGO_PATHS.map(function(p){
    var g = S('g', {}, svg);
    S('path', { transform: 'translate(' + p[0] + ' 585.4) scale(1 -1)', d: p[1], fill: '#E8ECF3' }, g);
    g.style.transformBox = 'fill-box'; g.style.transformOrigin = '50% 100%';
    return g;
  });
  var cur = S('rect', { x: 1963.6, y: 43.4, width: 195.1, height: 556, rx: 32.5, fill: '#2DD4BF' }, svg);
  return { svg: svg, w: w, h: h, k: h / 643, letters: letters, cur: cur };
}
// Letters pop in one per step while the cursor slides along behind them
function typeLogo(lg, T, t0, step){
  var CX = [40, 880, 1395, 1963.6], cx = CX[0];
  for (var k = 0; k < 3; k++){
    var t = t0 + k * step, p = seg(T, t, t + .42);
    lg.letters[k].style.opacity = T >= t ? 1 : 0;
    lg.letters[k].style.transform = 'translateY(' + (1 - E.outQ(p)) * 22 + '%) scale(' + (.45 + .55 * E.back(p)) + ')';
    cx = lerp(cx, CX[k + 1], E.outQ(seg(T, t, t + .1)));
  }
  lg.cur.setAttribute('x', cx);
  lg.cur.style.opacity = (T >= t0 && T < t0 + 3 * step) || blink(T) ? 1 : .12;
}
function makeVis(root){
  var d = el('div', 'abs', root);
  px(d, { left: VB.x - VB.s / 2, top: VB.y - VB.s / 2, width: VB.s, height: VB.s });
  var svg = S('svg', { viewBox: '-500 -500 1000 1000', width: VB.s, height: VB.s }, d);
  return { div: d, svg: svg };
}
function txtBlock(root, lay){
  var outer = el('div', 'abs', root);
  px(outer, { left: lay.x, top: lay.y, width: lay.w });
  outer.style.transform = 'translateY(-50%)';
  outer.style.textAlign = lay.align;
  return el('div', '', outer);
}
// A line of words, each its own span so it can slam in on the beat
function words(parent, parts){
  var spans = [];
  parts.forEach(function(part, pi){
    part[0].split(' ').forEach(function(wd, i, all){
      var s = el('span', 'w' + (part[1] ? ' ' + part[1] : ''), parent, wd);
      spans.push(s);
      if (i < all.length - 1 || pi < parts.length - 1) parent.appendChild(document.createTextNode(' '));
    });
  });
  return spans;
}
function chars(parent, text){ return text.split('').map(function(ch){ var s = el('span', 'w', parent, ch === ' ' ? '&nbsp;' : ch); return s; }); }
function slam(el, T, t0){
  if (T < t0){ el.style.opacity = 0; return; }
  var p = seg(T, t0, t0 + .38), e = E.outX(p);
  el.style.opacity = clamp(p * 3);
  el.style.transform = 'scale(' + lerp(1.55, 1, e) + ')';
  el.style.filter = p < 1 ? 'blur(' + (1 - e) * 10 + 'px)' : 'none';
}
function rise(el, T, t0, dur, dist){
  var p = E.outQ(seg(T, t0, t0 + dur));
  el.style.opacity = p; el.style.transform = 'translateY(' + (1 - p) * dist + 'px)';
}
// Masked line: rolls up into view at tIn and out through the top at tOut
function roll(el, T, tIn, tOut){
  var y = (1 - E.outX(seg(T, tIn, tIn + .55))) * 112 - (tOut ? E.inC(seg(T, tOut - .32, tOut)) * 112 : 0);
  el.style.transform = 'translateY(' + y + '%)';
}
function maskLine(parent, html, fs, cls){
  var m = el('div', 'mask', parent); m.style.height = fs * 1.14 + 'px';
  var r = el('div', 'roll disp' + (cls ? ' ' + cls : ''), m, html); r.style.fontSize = fs + 'px';
  return r;
}
function draw(el, len, p){ el.setAttribute('stroke-dasharray', len); el.setAttribute('stroke-dashoffset', len * (1 - p)); }
function show(el, on){ el.style.display = on ? '' : 'none'; }

var SCENES = [];
var scenesEl = document.getElementById('scenes');
function scene(a, b, build){
  var root = el('div', 'layer', scenesEl); root.style.display = 'none';
  var s = { a: a, b: b, root: root }; s.update = build(root); SCENES.push(s); return s;
}
var eraseX = null;

// ---------- 0 to 4s: cursor types the logo, then backspaces the screen ----------
scene(0, 4.45, function(root){
  var c = el('div', 'layer', root);
  var lh = (WIDE ? 17 : 15) * U, cy = H * (WIDE ? .43 : .42);
  var lw = el('div', 'abs', c), lg = makeLogo(lw, lh);
  px(lw, { left: (W - lg.w) / 2, top: cy - lh / 2, width: lg.w, height: lh });
  var tag = el('div', 'abs disp', c); px(tag, { left: 0, width: W, top: cy + lh / 2 + 4.5 * U });
  tag.style.textAlign = 'center'; tag.style.fontWeight = 700; tag.style.fontSize = (WIDE ? 4.8 : 5.2) * U + 'px';
  var tc = chars(tag, 'Security & AI consultant');
  var sub = el('div', 'abs fog', c, 'for small businesses and startups'); px(sub, { left: 0, width: W, top: cy + lh / 2 + 11.5 * U });
  sub.style.textAlign = 'center'; sub.style.fontSize = (WIDE ? 3 : 3.6) * U + 'px';
  var bar = el('div', 'abs', root); bar.style.background = 'var(--teal)'; bar.style.boxShadow = '0 0 ' + 3 * U + 'px rgba(45,212,191,.75)';
  var k = lg.k, X0 = (W - lg.w) / 2 + 1963.6 * k, BW = 195.1 * k, Y0 = cy - lh / 2 + 43.4 * k, BH = 556 * k;

  cue(1.0, 'pop'); cue(1.25, 'pop'); cue(1.5, 'pop');
  cue(2.0, 'impact'); ripple(2.0, W / 2, cy); ringFx(2.0, W / 2, cy, Math.max(W, H) * .75, C.teal, .7 * U, 1.2); shake(2.0, .5, .4); flash(2.0, .1);
  cue(3.68, 'whoosh', { dur: .6, pan: -.6 });

  return function(T){
    typeLogo(lg, T, 1.0, .25);
    var bump = T >= 2 ? .06 * Math.exp(-(T - 2) * 6) * Math.cos((T - 2) * 16) : 0;
    lw.style.transform = 'scale(' + (1 + bump) + ')';
    var out = 1 - seg(T, 3.4, 3.62);
    tc.forEach(function(s, i){ rise(s, T, 2.3 + i * .022, .5, 2.4 * U); s.style.opacity *= out; });
    rise(sub, T, 2.85, .6, 2 * U); sub.style.opacity *= out;
    if (T < 3.42){ bar.style.display = 'none'; c.style.clipPath = 'none'; return; }
    lg.cur.style.opacity = 0;
    var pA = E.inOut(seg(T, 3.42, 3.68)), pB = E.inOut(seg(T, 3.68, 4.22));
    var bw = lerp(BW, 1.1 * U, pA), bh = lerp(BH, H, pA), bt = lerp(Y0, 0, pA), mid = lerp(X0 + BW / 2, -3 * U, pB);
    bar.style.display = 'block';
    px(bar, { left: mid - bw / 2, top: bt, width: bw, height: bh, borderRadius: lerp(32.5 * k, .5 * U, pA) });
    bar.style.opacity = 1 - seg(T, 4.15, 4.42);
    eraseX = mid;
    c.style.clipPath = 'inset(0 ' + Math.max(0, W - mid) + 'px 0 0)';
  };
});

// ---------- 4 to 8s: one open padlock among closed ones, found first ----------
scene(3.68, 8.25, function(root){
  var vis = makeVis(root), cam = S('g', {}, vis.svg);
  var dim = 'rgba(232,236,243,.42)', locks = [], OPEN = null, OX = 190, OY = -95;
  for (var r = 0; r < 4; r++) for (var c = 0; c < 5; c++){
    var x = (c - 2) * 190, y = (r - 1.5) * 190;
    var gl = S('g', { transform: 'translate(' + x + ' ' + y + ')' }, cam), gi = S('g', {}, gl);
    var sh = S('path', { d: 'M-26 -8 V-34 A26 26 0 0 1 26 -34 V-8', fill: 'none', stroke: dim, 'stroke-width': 7, 'stroke-linecap': 'round' }, gi);
    var body = S('rect', { x: -40, y: -10, width: 80, height: 64, rx: 12, fill: '#0F1729', stroke: dim, 'stroke-width': 6 }, gi);
    var hole = S('path', { d: 'M0 9 a7 7 0 1 1 -.01 0 Z M-3 17 h6 v15 a3 3 0 0 1 -6 0 Z', fill: dim }, gi);
    var lk = { gi: gi, sh: sh, body: body, hole: hole, d: c + r, open: c === 3 && r === 1 };
    if (lk.open) OPEN = lk;

(function(){
